name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: 10.0.x }
      - run: dotnet run --project tests/SaveEngineTests.csproj --nologo
      - run: dotnet run --project tests/SteamDiscoveryTests.csproj --nologo
      - run: dotnet run --project tests/SaveLocationTests.csproj --nologo
      - run: dotnet run --project tests/SafetyTests.csproj --nologo
      - run: dotnet build OpenGameSave.csproj --configuration Release --nologo
      - run: pwsh -File tests/Test-Release.ps1
