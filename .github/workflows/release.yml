name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: 10.0.x }
      - name: Run tests
        shell: pwsh
        run: |
          dotnet run --project tests/SaveEngineTests.csproj --nologo
          dotnet run --project tests/SteamDiscoveryTests.csproj --nologo
          dotnet run --project tests/SaveLocationTests.csproj --nologo
          dotnet run --project tests/SafetyTests.csproj --nologo
      - name: Publish self-contained EXE
        shell: pwsh
        run: dotnet publish OpenGameSave.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o release\OpenGameSave --nologo
      - name: Verify EXE exists
        shell: pwsh
        run: if (!(Test-Path release\OpenGameSave\OpenGameSave.exe)) { throw 'Release EXE was not produced.' }
      - name: Create package
        shell: pwsh
        run: Compress-Archive -Path release\OpenGameSave\* -DestinationPath OpenGameSave-${{ github.ref_name }}-win-x64.zip
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: OpenGameSave-${{ github.ref_name }}-win-x64.zip
